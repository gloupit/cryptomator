name: Build Cryptomator APK

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Runs automatically on the 1st of every month

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleApkstoreDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cryptomator-apk
          path: presentation/build/outputs/apk/apkstore/debug/*.apk
